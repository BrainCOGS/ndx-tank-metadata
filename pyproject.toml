[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "ndx-tank-metadata"
version = "0.3.0"
description = "NWB:N extension for storing metadata for Tank lab"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Szonja Weigl"},
    { name = "Luiz Tauffer" },
    { name = "Ben Dichter", email = "ben.dichter@gmail.com"  },
    { name = "Christian Tabedzki", email = "ct5868@princeton.edu"  },
]
dependencies = [
    "pynwb>=4.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/catalystneuro/ndx-tank-metadata"

[tool.uv.build-backend]
module-name = "ndx_tank_metadata"
module-root = "src/pynwb"
source-include = ["spec/*.yaml", "src/spec/create_extension_spec.py"]
source-exclude = ["**/__pycache__/**", "**/*.pyc", "**/tests/**"]
wheel-exclude = ["**/__pycache__/**", "**/*.pyc", "**/tests/**"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "tomli>=2; python_version < '3.11'",
]

[tool.pytest.ini_options]
markers = ["packaging: builds and installs release artifacts in isolated Python 3.13 environments"]
